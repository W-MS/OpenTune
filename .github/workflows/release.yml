name: Release

# Dependencies are downloaded into the runner workspace. They are not committed.
# macOS also imports the Developer ID secrets into a temporary keychain, then deletes it.

on:
  workflow_dispatch:
    inputs:
      macos_format:
        description: macOS 安装包格式
        type: choice
        options:
          - both
          - pkg
          - dmg
        default: both
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  macos:
    name: macOS Universal2
    runs-on: macos-15
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      MACOS_FORMAT: ${{ github.event.inputs.macos_format || 'both' }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 确认签名 Secret 已配置
        env:
          MACOS_APPLICATION_P12_BASE64: ${{ secrets.MACOS_APPLICATION_P12_BASE64 }}
          MACOS_APPLICATION_P12_PASSWORD: ${{ secrets.MACOS_APPLICATION_P12_PASSWORD }}
          MACOS_INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in \
              MACOS_APPLICATION_P12_BASE64 \
              MACOS_APPLICATION_P12_PASSWORD \
              MACOS_INSTALLER_P12_BASE64 \
              MACOS_INSTALLER_P12_PASSWORD \
              APPLE_API_KEY_ID \
              APPLE_API_ISSUER_ID \
              APPLE_API_KEY_P8 \
              APPLE_TEAM_ID
          do
            if [ -z "${!name}" ]; then
              echo "缺少 Secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: 安装 Ninja
        run: brew install ninja

      - name: 下载 macOS 依赖到虚拟机
        run: bash .github/scripts/fetch-macos-deps.sh

      - name: 恢复已缓存的 ONNX Runtime
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: ThirdParty/onnxruntime-osx-universal2-1.20.0
          key: onnxruntime-osx-universal2-1.20.0-${{ hashFiles('scripts/build-onnxruntime-macos.sh') }}

      - name: 从源码构建 ONNX Runtime universal2
        if: steps.ort-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-onnxruntime-macos.sh

      - name: 清理 ONNX Runtime 中间目录
        if: always()
        run: |
          rm -rf \
            ThirdParty/.onnxruntime-1.20.0-src \
            ThirdParty/.onnxruntime-1.20.0-build \
            ThirdParty/.eigen-e7248b26a1ed53fa030c5c459f7ea095dfd276ac \
            ThirdParty/.eigen-e7248b26a1ed53fa030c5c459f7ea095dfd276ac.zip

      - name: 导入 Developer ID 证书
        env:
          MACOS_APPLICATION_P12_BASE64: ${{ secrets.MACOS_APPLICATION_P12_BASE64 }}
          MACOS_APPLICATION_P12_PASSWORD: ${{ secrets.MACOS_APPLICATION_P12_PASSWORD }}
          MACOS_INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .github/scripts/import-macos-certs.sh

      - name: 构建并签名安装包
        run: bash scripts/package-macos.sh --format "${MACOS_FORMAT}"

      - name: 公证并装订
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          shopt -s nullglob
          files=(dist/*.pkg dist/*.dmg)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "没有找到可公证的 pkg 或 dmg"
            exit 1
          fi
          bash .github/scripts/notarize-macos.sh "${files[@]}"

      - name: 上传 macOS 安装包
        uses: actions/upload-artifact@v4
        with:
          name: OpenTune-macOS-Universal2
          path: |
            dist/*.pkg
            dist/*.dmg
          if-no-files-found: error

      - name: 删除临时钥匙串和证书
        if: always()
        run: bash .github/scripts/cleanup-macos-signing.sh

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 下载 Windows 依赖到虚拟机
        shell: powershell
        run: .github/scripts/fetch-windows-deps.ps1

      - name: 配置 Visual Studio 2022
        shell: powershell
        run: |
          cmake --preset windows-ara-vs2022
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 编译 Release
        shell: powershell
        run: |
          cmake --build --preset windows-ara-release --target OpenTune_VST3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-ara-release --target OpenTuneStandalone_Standalone
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 打包便携版
        shell: powershell
        run: .github/scripts/package-windows-portable.ps1

      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: OpenTune-Windows-x64
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: 发布到 GitHub Release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部安装包
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" artifacts/* --clobber
          else
            gh release create "${tag}" artifacts/* \
              --title "OpenTune ${tag}" \
              --notes "macOS Universal2 安装包已使用 Developer ID 签名并公证。Windows 包是便携版，包含 Standalone、运行库和 VST3。"
          fi
